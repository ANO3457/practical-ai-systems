name: Validate Godot window migration hints
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: laaielichter/Godotwright
          ref: 5461211b3f5449243bacc6aaf59285b189fc8893
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Verify missing hints on unchanged product
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json
          files=json.loads(base64.b64decode(""))
          Path("test/review.test.ts").write_text(files["test/review.test.ts"],encoding="utf-8")
          PY
          npx vitest run test/review.test.ts -t "moved Godot 3 window properties" --reporter=junit --outputFile=/tmp/godot-red.xml || true
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse("/tmp/godot-red.xml").findall(".//testcase")
          active=[c for c in cases if c.find("skipped") is None]
          failures=[c for c in active if c.find("failure") is not None]
          print([(c.attrib["name"],c.find("failure").text) for c in failures])
          assert len(active)==9 and len(failures)==4,(len(active),len(failures))
          assert all("suggests the Window replacement" in c.attrib["name"] for c in failures)
          print("RED_CONTROL: 4 expected failures, 5 passing controls")
          PY
      - name: Apply candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,json
          for p,c in json.loads(base64.b64decode("")).items(): Path(p).write_text(c,encoding="utf-8")
          PY
      - uses: actions/checkout@v5
        with:
          repository: godotengine/godot-demo-projects
          ref: b761b4cd5718a7118f2c95eb55f181d0a5f004f1
          path: demos
          persist-credentials: false
          sparse-checkout: |
            2d/dodge_the_creeps
            2d/platformer
            2d/role_playing_game
            2d/finite_state_machine
            3d/platformer
            3d/squash_the_creeps
      - name: Full check and official demo review
        run: |
          npm run check
          for member in position min_size max_size borderless; do
            node dist/cli.js api "Window.$member"
          done
          git diff --check
        env:
          GODOT_DEMOS: demos
          GODOTWRIGHT_HOME: /tmp/godotwright-validation-home
      - name: Export tested files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,base64,hashlib
          for p in ["src/review/checks/api.ts","test/review.test.ts"]:
              print("TESTED_FILE",json.dumps({"path":p,"sha256":hashlib.sha256(Path(p).read_bytes()).hexdigest(),"data":base64.b64encode(Path(p).read_bytes()).decode()}))
          PY
