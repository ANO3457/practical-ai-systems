name: Validate module entry point
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hayagrivai-labs/phantom
          ref: f662e62a1cd3a43de4824198a264568df23ca316
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Install test-only candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("tests/test_main_module.py").write_text(base64.b64decode("").decode(),encoding="utf-8",newline="")
          PY
          ruff check --fix tests/test_main_module.py
          ruff format tests/test_main_module.py
      - name: Validate module entry point
        run: |
          ruff check src tests scripts
          python -m pytest --cov=phantom --cov-report=json --cov-report=term-missing:skip-covered
          python - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path("coverage.json").read_text())["files"]["src/phantom/__main__.py"]["summary"]
          assert summary["covered_lines"]==summary["num_statements"],summary
          print("MODULE_COVERAGE",summary)
          PY
          mypy --platform linux
          mypy --platform win32
          mypy --platform darwin
          python scripts/verify_release.py
          git diff --check
      - name: Exact tested hash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          print("TESTED_HASH",hashlib.sha256(Path("tests/test_main_module.py").read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: module-tested-candidate
          path: tests/test_main_module.py
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hayagrivai-labs/phantom
          ref: f662e62a1cd3a43de4824198a264568df23ca316
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Install test-only candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("tests/test_main_module.py").write_text(base64.b64decode("").decode(),encoding="utf-8",newline="")
          PY
          ruff check --fix tests/test_main_module.py
          ruff format tests/test_main_module.py
      - name: Validate module entry point
        run: |
          python -m pytest tests/test_main_module.py -v
          ruff check tests/test_main_module.py
          git diff --check
      - name: Exact tested hash
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          print("TESTED_HASH",hashlib.sha256(Path("tests/test_main_module.py").read_bytes()).hexdigest())
          PY
