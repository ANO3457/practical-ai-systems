name: Validate public grammar helper contract
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hayagrivai-labs/phantom
          ref: f662e62a1cd3a43de4824198a264568df23ca316
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply tests and documentation
        run: |
          python - <<'PY'
          import json,base64
          from pathlib import Path
          for p,c in json.loads(base64.b64decode("")).items():
              Path(p).write_text(c,encoding="utf-8")
          PY
          ruff check --fix tests/test_grammar.py
          ruff format tests/test_grammar.py
      - name: Required full suite and helper coverage
        run: |
          ruff check src tests scripts
          python -m pytest --cov=phantom --cov-report=json --cov-report=term-missing:skip-covered
          python - <<'PY'
          import ast,json
          from pathlib import Path
          tree=ast.parse(Path("src/phantom/grammar.py").read_text())
          missing=set(json.loads(Path("coverage.json").read_text())["files"]["src/phantom/grammar.py"]["missing_lines"])
          helpers={"is_known_instruction","get_instruction_spec","get_required_arg_count","get_total_arg_count","list_instruction_ids"}
          for node in tree.body:
              if isinstance(node,ast.FunctionDef) and node.name in helpers:
                  assert not missing.intersection(range(node.lineno,node.end_lineno+1)),node.name
          print("All five public grammar helpers fully covered")
          PY
          mypy --platform linux
          mypy --platform win32
          mypy --platform darwin
          python scripts/verify_release.py
          git diff --check
      - name: Exact tested files
        run: |
          python - <<'PY'
          import json,base64,hashlib
          from pathlib import Path
          for p in ["tests/test_grammar.py","docs/ARCHITECTURE.md"]:
              print("TESTED_FILE",json.dumps({"path":p,"sha256":hashlib.sha256(Path(p).read_bytes()).hexdigest(),"data":base64.b64encode(Path(p).read_bytes()).decode()}))
          PY
