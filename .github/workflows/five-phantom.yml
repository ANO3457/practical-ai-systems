name: Validate replay report provenance
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: basitalisandhu/mcp-auth-doctor
          ref: e92403298dc9f3315ba3f8d9ed40fbd2fde5772f
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]' build
      - name: Apply candidate
        run: |
          python - <<'PY'
          import base64, json, hashlib
          from pathlib import Path
          files = json.loads(base64.b64decode(""))
          for name, content in files.items():
              Path(name).write_text(content, encoding="utf-8")
          print("SOURCE_HASHES", json.dumps({p: hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files}))
          PY
      - name: Required tests and lint
        run: |
          python -m ruff format src/mcp_auth_doctor/cli.py src/mcp_auth_doctor/report.py tests/test_exchanges.py
          make check PY="python -m"
          python -m build
          git diff --check
      - name: Save exact formatted candidate
        run: |
          python - <<'PY'
          import json,base64,hashlib
          from pathlib import Path
          paths = ['src/mcp_auth_doctor/cli.py','src/mcp_auth_doctor/report.py','tests/test_exchanges.py','README.md']
          for p in paths:
              print('FORMATTED_FILE', json.dumps({'path':p,'sha256':hashlib.sha256(Path(p).read_bytes()).hexdigest(),'data':base64.b64encode(Path(p).read_bytes()).decode()}))
          PY
