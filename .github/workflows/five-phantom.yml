name: Validate Windows Darwin fixture fix
on: [push]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: windows-latest
            python: "3.11"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ANO3457/EvoScientist
          ref: ce8c7190e40a19ad0728c79274158ed7d3eb109f
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "${{ matrix.python }}"
      - name: Apply fixture correction
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path("tests/test_paths.py").write_bytes(base64.b64decode(""))
          PY
      - run: uv sync --dev --extra all-channels
      - name: Path tests, lint and source hash
        shell: bash
        run: |
          uv run pytest tests/test_paths.py -v
          uv run ruff check tests/test_paths.py
          uv run ruff format --check tests/test_paths.py
          git diff --check
          python -c "import hashlib;from pathlib import Path;print(hashlib.sha256(Path('tests/test_paths.py').read_bytes()).hexdigest())"
