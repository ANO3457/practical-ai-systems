name: Validate Godot migration guide
on: [push]
permissions:
  contents: read
jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: laaielichter/Godotwright
          ref: 66a8e70105b823d2746336afeba274828d9425a2
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Prepare candidate
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path("/tmp/migration_candidate.py").write_bytes(base64.b64decode(""))
          PY
          python /tmp/migration_candidate.py
      - name: Product checks
        run: npm run check
      - name: Check content and links
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import json,gzip,xml.etree.ElementTree as ET,hashlib
          page=Path("docs/godot-3-to-4.html").read_text()
          data=json.loads(gzip.decompress(Path("data/godot-api.json.gz").read_bytes()))
          for old,new in data["renames"]["classes"].items():
              assert "<code>"+old+"</code>" in page and "<code>"+new+"</code>" in page
          assert "godot-3-to-4.html" in Path("docs/index.html").read_text()
          assert "https://laaielichter.github.io/Godotwright/godot-3-to-4.html" in Path("docs/sitemap.xml").read_text()
          ET.parse("docs/sitemap.xml")
          class Parser(HTMLParser):
              def __init__(self): super().__init__();self.ids=set();self.links=[];self.h1=0
              def handle_starttag(self,tag,attrs):
                  attrs=dict(attrs)
                  if "id" in attrs: self.ids.add(attrs["id"])
                  if tag=="a": self.links.append(attrs.get("href",""))
                  if tag=="h1": self.h1+=1
          p=Parser();p.feed(page);assert p.h1==1
          for link in p.links:
              if link.startswith("#"): assert link[1:] in p.ids,link
          assert len(data["renames"]["classes"])>0
          for path in ["docs/index.html","docs/godot-3-to-4.html","docs/sitemap.xml"]:
              print("TESTED_HASH",path,hashlib.sha256(Path(path).read_bytes()).hexdigest())
          print("CONTENT_CHECKS_PASS")
          PY
          node dist/cli.js review test/fixtures/demo --min-score 80
          git diff --check
      - name: Visual proof
        run: |
          npm exec --yes --package=@playwright/test -- playwright install --with-deps chromium
          npm exec --yes --package=@playwright/test -- playwright screenshot --full-page --viewport-size="1280,900" file://$PWD/docs/godot-3-to-4.html migration-desktop.png
          npm exec --yes --package=@playwright/test -- playwright screenshot --full-page --viewport-size="390,844" file://$PWD/docs/godot-3-to-4.html migration-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: godot-migration-tested
          path: |
            docs/index.html
            docs/godot-3-to-4.html
            docs/sitemap.xml
            migration-desktop.png
            migration-mobile.png
