name: Validate startup command recognition
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: batrapulkit/squidbrake
          ref: b6ebf8637a0d256f220abdcb8c13dc7ccc5e63b8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - name: Regression before source change
        run: |
          python - <<'PY'
          import base64,json
          from pathlib import Path
          patch=json.loads(base64.b64decode(""))
          p=Path("tests/test_commands.py")
          p.write_text(p.read_text()+patch["tests"])
          Path("/tmp/startup-patch.json").write_text(json.dumps(patch))
          PY
          python -m pytest tests/test_commands.py -k startup_ --junitxml=/tmp/squid-red.xml -q || true
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases=ET.parse("/tmp/squid-red.xml").findall(".//testcase")
          failures=[c for c in cases if c.find("failure") is not None]
          print("RED_COUNTS",len(cases),len(failures))
          assert len(cases)==30 and len(failures)==15,(len(cases),len(failures))
          assert all("test_startup_changes_wait" in c.attrib["name"] for c in failures)
          PY
      - name: Apply narrow source fix
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          patch=json.loads(Path("/tmp/startup-patch.json").read_text())
          p=Path("commands.py")
          source=p.read_text()
          assert source.count("def classify(words:")==1
          source=source.replace("def classify(words:",patch["helper"]+chr(10)+"def classify(words:")
          anchor='    if prog == "truncate" or prog in ("clear-content", "clc")'
          assert source.count(anchor)==1
          insert=chr(10).join(['    if (why := _starts_automatically(prog, lower)):','        cmd.kind, cmd.why = "irreversible", why','        return [cmd], []',''])
          source=source.replace(anchor,insert+anchor)
          p.write_text(source)
          PY
      - name: Full tests and scenario
        run: |
          python -m pytest -q
          python tests/e2e_business_scenario.py
          git diff --check
      - name: Exact tested manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=["commands.py","tests/test_commands.py"]
          manifest={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          Path("tested-manifest.json").write_text(json.dumps(manifest,indent=2))
          print("TESTED_HASHES",json.dumps(manifest))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: squid-tested-candidate
          path: |
            commands.py
            tests/test_commands.py
            tested-manifest.json
