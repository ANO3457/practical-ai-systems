name: Validate HTTP header name JSON
on: [push]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: basitalisandhu/cc-hooks
          ref: ea91bb16191a2da29d22f9e7cd8110fd31a24223
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]" build
      - name: Regression against unchanged code
        run: |
          python - <<'PY'
          import base64,gzip,json,subprocess,sys
          from pathlib import Path
          data=json.loads(gzip.decompress(base64.b64decode("")))
          Path("tests/test_cli.py").write_text(data["tests/test_cli.py"])
          result=subprocess.run([sys.executable,"-m","pytest","tests/test_cli.py","-k","lists_http_header_names","-q"],text=True,capture_output=True)
          print(result.stdout);print(result.stderr)
          assert result.returncode==1 and "2 failed" in result.stdout and "header_names" in result.stdout
          for path,source in data.items(): Path(path).write_text(source)
          PY
      - name: Final checks
        run: |
          python -m ruff format src/cc_hooks/cli.py src/cc_hooks/settings.py tests/test_cli.py
          make check PY="python -m"
          make docs PY="python -m"
          make examples PY="python -m"
          python -m build
          git diff --check
          git diff --exit-code -- docs/events.md
          sha256sum src/cc_hooks/cli.py src/cc_hooks/settings.py tests/test_cli.py README.md CHANGELOG.md
      - uses: actions/upload-artifact@v4
        with:
          name: cc-http-headers-tested
          path: |
            src/cc_hooks/cli.py
            src/cc_hooks/settings.py
            tests/test_cli.py
            README.md
            CHANGELOG.md
