name: Validate CONTINUUM review fixes
on: [push]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ANO3457/CONTINUUM
          ref: 5a16e4b31164c83337b1f55017e0b56d1f42fd79
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Apply test candidate
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path("tests/test_payload_offload.py").write_bytes(base64.b64decode(""))
          PY
      - name: Verify real rewrite after a read error
        run: |
          python -m pytest tests/test_payload_offload.py -v
          python -m ruff check tests/test_payload_offload.py
          python -m ruff format --check tests/test_payload_offload.py
          git diff --check
          sha256sum tests/test_payload_offload.py
