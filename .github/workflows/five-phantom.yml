name: Validate Phantom line separators
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hayagrivai-labs/phantom
          ref: ec31f044b366156e500d94b97913a46b5665e718
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Apply test-only candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("tests/test_properties.py").write_bytes(base64.b64decode(""))
          Path("CHANGELOG.md").write_bytes(base64.b64decode(""))
          PY
      - name: Ten independent Hypothesis seeds
        run: |
          for seed in $(seq 1 10); do
            python -m pytest tests/test_properties.py --hypothesis-seed="$seed" -q
          done
      - name: Full tests and quality checks
        run: |
          ruff check src tests scripts
          mypy --platform linux
          mypy --platform win32
          mypy --platform darwin
          python -m pytest --cov=phantom --cov-report=term-missing:skip-covered
          python scripts/verify_release.py
          git diff --check
