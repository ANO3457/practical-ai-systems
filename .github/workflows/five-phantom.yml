name: Validate Phantom refreshed main
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ANO3457/phantom
          ref: 9906ec102cdb6645ab3c9098e92746d4c2eff483
          fetch-depth: 0
          persist-credentials: false
      - name: Merge exact upstream base and retain both changelog entries
        run: |
          git config user.name validation
          git config user.email validation@example.invalid
          git fetch https://github.com/hayagrivai-labs/phantom.git 3a63e247b19c3d4b922e805848ea3b0dd00db104
          git merge --no-commit --no-ff FETCH_HEAD || test "$(git diff --name-only --diff-filter=U)" = CHANGELOG.md
          python - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          p = Path("CHANGELOG.md")
          text, n = re.subn(r"^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n", r"\1\2", p.read_text(), flags=re.M | re.S)
          assert n == 1, n
          p.write_text(text)
          assert not any(marker in text for marker in ("<<<<<<<", "=======", ">>>>>>>"))
          print("CANDIDATE_HASHES", json.dumps({str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in (Path("CHANGELOG.md"), Path("tests/test_properties.py"))}))
          PY
          git add CHANGELOG.md
          test "$(git diff --name-only --diff-filter=U)" = ""
          git diff --stat 3a63e247b19c3d4b922e805848ea3b0dd00db104
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Ten independent Hypothesis seeds
        run: |
          for seed in $(seq 1 10); do
            python -m pytest tests/test_properties.py --hypothesis-seed="$seed" -q
          done
      - name: Full tests and quality checks
        run: |
          ruff check src tests scripts
          mypy --platform linux
          mypy --platform win32
          mypy --platform darwin
          python -m pytest --cov=phantom --cov-report=term-missing:skip-covered
          python scripts/verify_release.py
          git diff --check
