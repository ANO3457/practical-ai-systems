name: Validate EvoScientist review fixes
on: [push]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          repository: EvoScientist/EvoScientist
          ref: 0e87c5bdffdac1e6ced1e9a0a4fd556b8b2d3299
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
      - name: Apply exact candidate data
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip,json
          from pathlib import Path
          data=json.loads(gzip.decompress(base64.b64decode("")))
          for path,source in data.items():
              Path(path).write_text(source,encoding="utf-8")
          PY
      - run: uv sync --dev --extra all-channels
      - name: Format and lint changed files
        run: |
          uv run ruff format EvoScientist/paths.py EvoScientist/deploy/launcher.py EvoScientist/langgraph_dev/legacy_import.py tests/test_paths.py tests/test_launcher.py tests/test_legacy_import.py
          uv run ruff check EvoScientist/paths.py EvoScientist/deploy/launcher.py EvoScientist/langgraph_dev/legacy_import.py tests/test_paths.py tests/test_launcher.py tests/test_legacy_import.py
      - name: Real filesystem and neighboring tests
        run: uv run pytest tests/test_paths.py tests/test_launcher.py tests/test_legacy_import.py -v --timeout=15
      - name: Record source hashes
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=["EvoScientist/paths.py","EvoScientist/deploy/launcher.py","EvoScientist/langgraph_dev/legacy_import.py","tests/test_paths.py","tests/test_launcher.py","tests/test_legacy_import.py"]
          data={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          Path("tested-manifest.json").write_text(json.dumps(data,indent=2))
          print("TESTED_MANIFEST",json.dumps(data))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: evo-tested-${{ matrix.os }}
          path: |
            EvoScientist/paths.py
            EvoScientist/deploy/launcher.py
            EvoScientist/langgraph_dev/legacy_import.py
            tests/test_paths.py
            tests/test_launcher.py
            tests/test_legacy_import.py
            tested-manifest.json
