name: Validate documented Godot review workflow
on:
  push:
    paths: [.github/workflows/five-phantom.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: laaielichter/Godotwright
          ref: 0dd9ce885df21fafefc09f8ddd6e92745d5ae303
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Apply README candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("README.md").write_bytes(base64.b64decode(""))
          PY
      - name: Full check and execute exact documented command
        run: |
          npm run check
          python - <<'PY'
          import shlex,subprocess,hashlib
          from pathlib import Path
          section=Path("README.md").read_text().split("## Review in GitHub Actions",1)[1].split("## Mods",1)[0]
          fence=chr(96)*3
          snippet=section.split(fence+"yaml",1)[1].split(fence,1)[0]
          assert "on: [push, pull_request]" in snippet and "contents: read" in snippet
          command=next(line.strip()[7:] for line in snippet.splitlines() if line.strip().startswith("- run: "))
          assert command.endswith("review . --min-score 80")
          for fixture,expected in [("demo",0),("broken",1)]:
              result=subprocess.run(shlex.split(command),cwd=Path("test/fixtures")/fixture,text=True,capture_output=True,timeout=180)
              print("README_EXAMPLE",fixture,"exit",result.returncode)
              print(result.stdout,result.stderr)
              assert result.returncode==expected
              assert ("overall: 100/100" in result.stdout) if fixture=="demo" else ("error [" in result.stdout)
          print("TESTED_HASH",hashlib.sha256(Path("README.md").read_bytes()).hexdigest())
          PY
          git diff --check
