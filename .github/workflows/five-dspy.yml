name: Validate DSPy field names
on:
  push:
    paths: [.github/workflows/five-dspy.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: SuperagenticAI/dspy-code
          ref: 0774961d3cdae6e617d2469dd3f877633c41b503
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test environment
        run: python -m pip install -e '.[dev,test]'
      - name: Add regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("tests/test_input_field_names.py").write_bytes(base64.b64decode(""))
          PY
      - name: Prove regression on untouched source
        run: |
          set +e
          python -m pytest -o addopts='' tests/test_input_field_names.py -q > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -eq 1
          grep -q '35 failed, 6 passed' /tmp/red.log
      - name: Apply fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("dspy_code/validation/input_validator.py").write_bytes(base64.b64decode(""))
          PY
      - name: Verify regression and related tests
        run: |
          python -m pytest -o addopts='' tests/test_input_field_names.py tests/test_validation.py -q
          ruff check dspy_code/validation/input_validator.py tests/test_input_field_names.py
          ruff format --check dspy_code/validation/input_validator.py tests/test_input_field_names.py
          git diff --check
  actual-head:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ANO3457/dspy-code
          ref: 18e9505c9a3ca4e7d00f978c0f9f241134205946
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,test]'
      - run: python -m pytest -o addopts='' tests/ -q
      - run: ruff check dspy_code/validation/input_validator.py tests/test_input_field_names.py
      - run: ruff format --check dspy_code/validation/input_validator.py tests/test_input_field_names.py
