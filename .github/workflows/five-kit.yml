name: Validate maintainer-kit pytest discovery
on:
  push:
    paths: [.github/workflows/five-kit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: goonobu-dot/codex-maintainer-kit
          ref: d17275d454beb11e707f248e0447a367895d0552
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Add behavioral regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          Path("tests/test_verification_discovery.py").write_bytes(base64.b64decode(""))
          PY
      - name: Prove broken generated commands on base
        run: |
          set +e
          python -m pytest tests/test_verification_discovery.py -q > /tmp/red.log 2>&1
          code=$?
          set -e
          cat /tmp/red.log
          test "$code" -eq 1
          grep -q '6 failed, 1 passed' /tmp/red.log
      - name: Apply candidate
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json
          for name, content in json.loads(base64.b64decode("")).items():
              Path(name).write_text(content, encoding="utf-8")
          PY
      - name: Full tests and diff check
        run: |
          python -m pytest tests -q
          git diff --check
