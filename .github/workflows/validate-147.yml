name: Validate PR 147 merge candidate
on:
  push:
    branches: [validation/resolve-147-oct27]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ANO3457/practical-ai-systems
          ref: bebd87f804cc32f6ef74e4f315660b5de5e33a92
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual PR head
        run: |
          python -m unittest discover -s tests -p 'test_render*.py' -v
          python scripts/render_systems.py
          git diff --check
