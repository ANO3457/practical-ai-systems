name: Validate NetBox changelog filters
on:
  push:
    paths: [.github/workflows/five-netbox.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netboxlabs/netbox-mcp-server
          ref: 8850301ab542565f37cef39c6c1523c86ec2a02e
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - name: Add regression tests
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('tests/test_changelog_filters.py').write_bytes(base64.b64decode(''))
          PY
      - name: Prove regression on unchanged base
        run: |
          set +e
          uv run pytest tests/test_changelog_filters.py -q > red.txt 2>&1
          result=$?
          set -e
          cat red.txt
          test $result -eq 1
          grep -q '2 failed, 2 passed' red.txt
      - name: Apply candidate
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('src/netbox_mcp_server/server.py').write_bytes(base64.b64decode(''))
          PY
      - name: Full tests and lint
        run: |
          uv run pytest -q
          uv run ruff check
          uv run ruff format --check src/netbox_mcp_server/server.py tests/test_changelog_filters.py
          git diff --check
