name: Validate NetBox CORS session termination
on:
  push:
    paths: [.github/workflows/five-netbox.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: netboxlabs/netbox-mcp-server
          ref: 8850301ab542565f37cef39c6c1523c86ec2a02e
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - name: Add real HTTP regression tests
        run: |
          cat > tests/test_http_cors.py <<'PY'
          """Exercise the HTTP transport's actual CORS and session lifecycle."""
          from collections.abc import Iterator
          
          import pytest
          from fastmcp import FastMCP
          from starlette.middleware import Middleware
          from starlette.testclient import TestClient
          from starlette.types import ASGIApp
          
          from netbox_mcp_server import server
          from netbox_mcp_server.config import Settings
          
          ORIGIN = "https://client.example"
          INITIALIZE = {
              "jsonrpc": "2.0", "id": 1, "method": "initialize",
              "params": {"protocolVersion": "2024-11-05", "capabilities": {},
                         "clientInfo": {"name": "cors-test", "version": "1.0"}},
          }
          
          
          @pytest.fixture
          def http_client(monkeypatch: pytest.MonkeyPatch) -> Iterator[TestClient]:
              """Use main's configured middleware with a real FastMCP HTTP app."""
              mcp = FastMCP(name="cors-test")
              apps: list[ASGIApp] = []
          
              def capture_run(
                  *, transport: str, host: str, port: int, middleware: list[Middleware]
              ) -> None:
                  assert transport == "http"
                  apps.append(mcp.http_app(middleware=middleware))
          
              settings = Settings(
                  _env_file=None, netbox_url="http://127.0.0.1:9",
                  netbox_token="test-token", transport="http", cors_origins=[ORIGIN],
                  mcp_auth_token=None, enable_plugin_discovery=False,
              )
              monkeypatch.setattr(server, "mcp", mcp)
              monkeypatch.setattr(mcp, "run", capture_run)
              monkeypatch.setattr(server, "parse_cli_args", lambda: {})
              monkeypatch.setattr(server, "Settings", lambda **kwargs: settings)
              server.main()
              try:
                  with TestClient(apps[0]) as client:
                      yield client
              finally:
                  server.netbox.session.close()
          
          
          @pytest.mark.parametrize("method", ["GET", "POST", "DELETE"])
          def test_allowed_origin_can_preflight_mcp_methods(
              http_client: TestClient, method: str
          ) -> None:
              response = http_client.options(
                  "/mcp/", headers={"Origin": ORIGIN,
                      "Access-Control-Request-Method": method,
                      "Access-Control-Request-Headers": "mcp-session-id,mcp-protocol-version"},
              )
              assert response.status_code == 200
              assert response.headers["access-control-allow-origin"] == ORIGIN
          
          
          def test_unconfigured_origin_cannot_preflight_delete(http_client: TestClient) -> None:
              response = http_client.options(
                  "/mcp/", headers={"Origin": "https://untrusted.example",
                      "Access-Control-Request-Method": "DELETE"},
              )
              assert response.status_code == 400
              assert "access-control-allow-origin" not in response.headers
          
          
          def test_delete_ends_the_mcp_session(http_client: TestClient) -> None:
              response = http_client.post(
                  "/mcp/", json=INITIALIZE,
                  headers={"Origin": ORIGIN, "Accept": "application/json, text/event-stream"},
              )
              assert response.status_code == 200
              session_id = response.headers["mcp-session-id"]
              headers = {"Origin": ORIGIN, "mcp-session-id": session_id,
                         "mcp-protocol-version": "2024-11-05"}
              preflight = http_client.options(
                  "/mcp/", headers={"Origin": ORIGIN, "Access-Control-Request-Method": "DELETE",
                                   "Access-Control-Request-Headers": "mcp-session-id"},
              )
              assert preflight.status_code == 200
              ended = http_client.delete("/mcp/", headers=headers)
              assert ended.status_code == 200
              assert ended.headers["access-control-allow-origin"] == ORIGIN
          
          PY
          uv run ruff format tests/test_http_cors.py
      - name: Check unchanged-base regression
        run: |
          set +e
          uv run pytest tests/test_http_cors.py -q > /tmp/red.txt 2>&1
          result=$?
          set -e
          cat /tmp/red.txt
          test "$result" -eq 1
          grep -q '2 failed, 3 passed' /tmp/red.txt
      - name: Apply narrow fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/netbox_mcp_server/server.py')
          s=p.read_text()
          old='allow_methods=["GET", "POST", "OPTIONS"]'
          assert s.count(old)==1
          p.write_text(s.replace(old,'allow_methods=["GET", "POST", "DELETE", "OPTIONS"]'))
          PY
      - name: Full tests and lint
        run: |
          uv run pytest -q
          uv run ruff check .
          uv run ruff format --check src/netbox_mcp_server/server.py tests/test_http_cors.py
          git diff --check
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          paths=['src/netbox_mcp_server/server.py','tests/test_http_cors.py']
          result={p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in paths}
          print(json.dumps(result,indent=2))
          PY
          cat tests/test_http_cors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: netbox-cors-test-candidate
          path: |
            tests/test_http_cors.py
            src/netbox_mcp_server/server.py
