name: Validate agent-helper malformed catalog entries
on:
  push:
    paths: [.github/workflows/five-agent-helper.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PiefkePaul/agent-helper
          ref: b804dc1109b9124b3864c5020b0e60960346bb5e
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Add API regression cases
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('tests/test_capabilities.py').write_bytes(base64.b64decode(''))
          PY
      - name: Prove regression on unchanged base
        run: |
          set +e
          pytest tests/test_capabilities.py -k invalid_entries_in_a_catalog_file -q > red.txt 2>&1
          result=$?
          set -e
          cat red.txt
          test $result -eq 1
          grep -q '5 failed, 1 passed' red.txt
      - name: Apply catalog fix
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          Path('agent_helper/catalog.py').write_bytes(base64.b64decode(''))
          PY
      - name: Full tests and lint
        run: |
          pytest -q
          ruff check agent_helper tests
          git diff --check
